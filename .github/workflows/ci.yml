# CI — remediation 2026-06-10 (M5, L9).
#
# Runs tsc + the full node:test suite on ubuntu and macos (vendored history
# shows Linux-vs-Darwin divergence caught real bugs; see
# detectors/_q72-trace.ts), then enforces that the committed dist/ is
# byte-identical to a fresh rebuild (`npm test` runs `tsc` first, so any
# drift shows up in `git diff -- dist`).

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check, build, and test
        run: npm test

      - name: Verify committed dist/ matches fresh rebuild (L9)
        run: git diff --exit-code -- dist

      # The certification harness is plain .mjs outside dist/, so `npm test` (which runs
      # the compiled dist/test suite) never touched it. A scorer whose own tests only run
      # by hand is a scorer that drifts. Gating.
      - name: Certification harness tests
        run: npm run test:cert

      # The T2 harness tests resolve the clustersynth sibling, which a runner does not
      # have. clustersynth is public; pin the SHA the registered T2 run used (c1387a4,
      # recorded in run-t2-20260808T121710Z) so CI exercises the same generator, and build
      # its dist (untracked in that repo). CLUSTERSYNTH_ROOT is the harness's documented
      # override for a checkout that is not a filesystem sibling.
      - name: Check out clustersynth (pinned to the registered T2 SHA)
        uses: actions/checkout@v4
        with:
          repository: johnpatrickwarren-oss/clustersynth
          ref: c1387a4da67242e0807facd04929b5d975c795b0
          path: .clustersynth-ci

      # npm install, not ci: clustersynth commits no lockfile at the pinned SHA.
      - name: Build clustersynth dist
        run: npm install && npm run build
        working-directory: .clustersynth-ci

      # The coverage battery's own tests live outside dist/ for the same reason the
      # certification harness's do (plain .mjs), so `npm test` never touched them either.
      # They carry the substrate guards the coverage PREREGISTRATION registers -- including
      # Amendment v2.C1's held-out autocorrelation bound, whose whole job is to make a
      # regression to the pre-C1 lattice draw impossible to run. A guard that only runs by
      # hand is a guard that stops running. Gating.
      - name: Coverage battery harness tests
        run: npm run test:coverage-battery
        env:
          CLUSTERSYNTH_ROOT: ${{ github.workspace }}/.clustersynth-ci

      # Card schema validation is cheap, deterministic, and independent of any sibling repo
      # (unlike the expiry check below), so unlike expiry it CAN gate: a card that fails its
      # own schema makes every verdict downstream of it unreadable.
      - name: Certification card schema
        run: npm run cert:validate-cards

      # Expiry is the protocol's answer to a claim that outlives the code it describes:
      # drift in any hash a card pins flips that card to EXPIRED, and CI is where it has
      # to be seen, because the drift arrives with somebody else's commit.
      #
      # NOT gating, and the reason is a limitation rather than a preference: family_E's
      # card pins a file in a SIBLING repo (../deploysignal/tools/calibrators/family-e.ts),
      # a runner checks out this repo only, and expiry-check.mjs reports a file it cannot
      # read as drift -- it does not distinguish "changed" from "not present here". So on
      # CI this step would fail every run for a reason that says nothing about the cards.
      # To make it gating, either check out the sibling repo and set CERT_SIBLING_ROOT to
      # its parent, or teach the tool to report an unreadable sibling pin separately from a
      # changed hash. Until then the log carries the finding and a human reads it.
      - name: Certification card expiry (reported, not gating — see comment)
        run: npm run cert:expiry
        continue-on-error: true
